<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dread · 404</title>
  <link rel="icon" href="https://dread.vc/assets/dread.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#050505; --ink:#ececec; --muted:#8a8a8a; --line:#1c1c1c; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 Manrope, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      background: #0b0b0b;
      text-align: center;
    }
    img {
      width: 48px; height: 48px; border-radius: 12px;
      object-fit: cover; margin-bottom: 16px;
    }
    h1 { font-size: 42px; letter-spacing: -.04em; }
    p { color: var(--muted); margin: 8px 0 22px; }
    a {
      display: inline-block;
      color: #050505;
      background: #ececec;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://dread.vc/assets/dread.jpg" alt="">
    <h1>404</h1>
    <p>this page is not here.</p>
    <a href="https://dread.vc/">back to dread</a>
  </div>
</body>
</html>
